name: Build Orbit Driving School APK

on:
  push:
    branches:
      - main

  workflow_dispatch:


jobs:
  build-apk:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Project
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.85.3


      - name: Build APK
        run: |
          flet build apk --verbose --yes


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: orbit-driving-school-apk
          path: build/apk/*.apk
